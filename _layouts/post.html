---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="byline">
    By <a href="{{ '/about/' | relative_url }}">{{ site.name }}</a> &middot;
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
  {{ content }}
</article>
